name: Supabase keep-alive

# Supabase free-tier projects pause after 7 days of no activity. This makes one
# tiny read every day so the project never goes idle long enough to be paused.
# Runs in GitHub's cloud, so it works even when the local machine / Docker stack
# is off. Trigger it by hand any time from the Actions tab (workflow_dispatch).

on:
  schedule:
    - cron: "17 9 * * *"   # 09:17 UTC daily (odd minute = less chance of a busy-scheduler delay)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (one-row read)
        env:
          # These are the PUBLIC (publishable) Supabase URL + anon key — the same
          # values already shipped in the frontend bundle and gated by RLS, so
          # inlining them here exposes nothing new and avoids needing repo secrets.
          SUPABASE_URL: "https://omotngyhvqfqdqfwvhzg.supabase.co"
          SUPABASE_ANON_KEY: "sb_publishable_zR8szEgDg7P4ZKPGU1Z1Dw_KgtsVcPU"
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/flyers?select=id&limit=1")
          echo "Supabase responded: $code"
          # 2xx = healthy. Anything else fails the run so you get an email alert.
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
